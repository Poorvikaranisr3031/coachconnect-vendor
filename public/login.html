<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vendor sign in · CoachConnect</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--blue:#1457c5;--ink:#17253d;--muted:#718099;--line:#e4eaf2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#edf4ff,#f8faff 60%,#fff);font:14px 'DM Sans',sans-serif;color:var(--ink);padding:20px}.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:23px;padding:clamp(24px,5vw,38px);box-shadow:0 20px 60px #183d7610}.brand{display:flex;gap:11px;align-items:center;font:800 20px Manrope,sans-serif;text-decoration:none;color:inherit}.mark{width:41px;height:41px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px}.brand small{display:block;font:700 9px 'DM Sans',sans-serif;letter-spacing:1.4px;color:#8794a8;margin-top:1px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--blue);font-weight:800;margin-top:30px}.card h1{font:800 28px Manrope,sans-serif;letter-spacing:-1px;margin:7px 0}.sub{color:var(--muted);line-height:1.6;margin:0 0 22px}.field{display:block;margin:14px 0;font-size:12px;font-weight:700;color:#526178}.field input{display:block;width:100%;height:46px;margin-top:7px;padding:0 13px;border:1px solid #dce4ef;border-radius:10px;font:400 14px 'DM Sans',sans-serif;outline:none}.field input:focus{border-color:#5a90e8;box-shadow:0 0 0 3px #e8f0ff}.btn{height:46px;width:100%;border:0;border-radius:10px;background:var(--blue);color:#fff;font:700 14px 'DM Sans',sans-serif;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.5}.alt{background:#f2f6fd;color:var(--blue)}.link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700;padding:14px 0 0;cursor:pointer}.msg{min-height:22px;font-size:12px;color:#16865c;margin:13px 0 0}.msg.err{color:#b43b43}.fine{font-size:11px;color:#95a0b0;text-align:center;margin-top:24px}.hidden{display:none!important}</style></head><body><main class="card"><a class="brand" href="/" ><span class="mark">CC</span><span>CoachConnect<small>RAILWAY FOOD, CONNECTED</small></span></a><div class="eyebrow">VENDOR WORKSPACE</div><h1 id="title">Welcome back<span style="color:#4387f5">.</span></h1><p class="sub" id="sub">Sign in using your email and password.</p><form id="login-form"><label class="field">Email address<input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><button class="btn" id="login-btn" type="submit">Sign in</button><button class="link" id="first-time" type="button">First time? Verify email and create a password</button></form><form id="code-form" class="hidden"><label class="field">Email address<input id="code-email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field hidden" id="code-row">Email verification code<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></label><button class="btn" id="code-btn" type="submit">Send verification code</button><button class="link" id="back-login" type="button">Back to password sign in</button></form><form id="setup-form" class="hidden"><label class="field">Create password<input id="new-password" type="password" autocomplete="new-password" minlength="10" required placeholder="At least 10 characters"></label><label class="field">Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" required placeholder="Enter password again"></label><button class="btn" id="setup-btn" type="submit">Save password</button></form><p id="msg" class="msg" role="status" aria-live="polite"></p><p class="fine">Use at least 10 characters. Your password is stored as a secure hash.</p></main><script>(function(){const A=window.hatchable&&window.hatchable.auth,$=s=>document.querySelector(s);let step='login',verifiedEmail='';const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')?n:'/'};function say(t,err){$('#msg').textContent=t||'';$('#msg').className='msg'+(err?' err':'')}function show(which,title,sub){['login-form','code-form','setup-form'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==which));$('#title').textContent=title;$('#sub').textContent=sub;step=which; say('')}async function jsonRequest(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed.');return d}async function enterPassword(email,password){await jsonRequest('/api/password-auth',{action:'login',email,password});location.replace(next())}if(!A){say('Email verification service is unavailable. Refresh and try again.',true);return}fetch('/api/password-auth',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(d.user)location.replace(next())}).catch(()=>{});A.getSession().then(s=>{if(s&&s.user){verifiedEmail=s.user.email||'';show('setup-form','Create your password','Your email is verified. Create a password so future sign-ins do not need a code.')}}).catch(()=>{});$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const b=$('#login-btn');b.disabled=true;try{await enterPassword($('#email').value.trim(),$('#password').value)}catch(err){say(err.message,true)}finally{b.disabled=false}});$('#first-time').addEventListener('click',()=>{ $('#code-email').value=$('#email').value.trim();$('#code-row').classList.add('hidden');$('#code-btn').textContent='Send verification code';show('code-form','Create your account','Verify your email once, then create a password for future sign-ins.')});$('#back-login').addEventListener('click',()=>show('login-form','Welcome back.','Sign in using your email and password.'));$('#code-form').addEventListener('submit',async e=>{e.preventDefault();const b=$('#code-btn');b.disabled=true;try{const email=$('#code-email').value.trim();if(!$('#code-row').classList.contains('hidden')){const r=await A.verifyCode({email,code:$('#code').value.trim()});if(!r||!r.user)throw new Error('That code did not work. Request a new code and try again.');verifiedEmail=email;show('setup-form','Create your password','Email verified. Set a password to use for future sign-ins.');return}await A.startLogin({email});$('#code-row').classList.remove('hidden');b.textContent='Verify code and continue';say('Code sent. Check your inbox.')}catch(err){say(err.message||'Could not verify email. Try again.',true)}finally{b.disabled=false}});$('#setup-form').addEventListener('submit',async e=>{e.preventDefault();const password=$('#new-password').value,confirm=$('#confirm-password').value,b=$('#setup-btn');if(password.length<10){say('Use at least 10 characters.',true);return}if(password!==confirm){say('Passwords do not match.',true);return}b.disabled=true;try{await jsonRequest('/api/password-setup',{password});await enterPassword(verifiedEmail||($('#code-email').value||$('#email').value).trim(),password)}catch(err){say(err.message||'Could not save password. Try again.',true)}finally{b.disabled=false}})})();</script></body></html>
